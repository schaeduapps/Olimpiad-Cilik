  <!-- AUDIO ENGINE (Web Audio API Synthesizer) -->
  <script>
    class WebAudioEngine {
      constructor() {
        this.ctx = null;
        this.bgmEnabled = false;
        this.sfxEnabled = true;
        this.bgmInterval = null;
        this.bgmStep = 0;
      }

      initCtx() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleBGM() {
        this.initCtx();
        this.bgmEnabled = !this.bgmEnabled;
        const icon = document.getElementById('bgm-icon');
        const text = document.getElementById('bgm-status-text');
        
        if (this.bgmEnabled) {
          text.innerText = "BGM: ON";
          icon.classList.remove('text-pink-400');
          icon.classList.add('text-green-400', 'animate-spin');
          this.startKpopBGM();
        } else {
          text.innerText = "BGM: OFF";
          icon.classList.remove('text-green-400', 'animate-spin');
          icon.classList.add('text-pink-400');
          this.stopKpopBGM();
        }
      }

      toggleSFX() {
        this.initCtx();
        this.sfxEnabled = !this.sfxEnabled;
        const text = document.getElementById('sfx-status-text');
        text.innerText = this.sfxEnabled ? "SFX: ON" : "SFX: OFF";
      }

      startKpopBGM() {
        if (this.bgmInterval) clearInterval(this.bgmInterval);
        const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
        this.bgmStep = 0;
        
        this.bgmInterval = setInterval(() => {
          if (!this.bgmEnabled || !this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = this.bgmStep % 4 === 0 ? 'triangle' : 'sine';
          
          const freq = notes[(this.bgmStep * 3 + (this.bgmStep % 2)) % notes.length];
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          
          gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
          
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          
          osc.start();
          osc.stop(this.ctx.currentTime + 0.2);
          
          this.bgmStep = (this.bgmStep + 1) % 16;
        }, 220);
      }

      stopKpopBGM() {
        if (this.bgmInterval) {
          clearInterval(this.bgmInterval);
          this.bgmInterval = null;
        }
      }

      playCorrect() {
        if (!this.sfxEnabled) return;
        this.initCtx();
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.15, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.25);
        });
      }

      playWrong() {
        if (!this.sfxEnabled) return;
        this.initCtx();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }

      playMilestoneSound() {
        if (!this.sfxEnabled) return;
        this.initCtx();
        const now = this.ctx.currentTime;
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.1);
          gain.gain.setValueAtTime(0.2, now + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.1);
          osc.stop(now + idx * 0.1 + 0.45);
        });
      }
    }

    const audioSystem = new WebAudioEngine();
  </script>

      startMathSession(level, mode) {
        this.currentLevel = level;
        this.currentMode = mode;
        this.askedQuestionIds.clear();
        this.score = { correct: 0, wrong: 0, streak: 0 };
        this.loadNextQuestion();
      }

      generateUniqueQuestion(level, mode) {
        let op = mode;
        if (mode === 'MIX') {
          op = Math.random() > 0.5 ? 'ADDITION' : 'SUBTRACTION';
        }

        let num1 = 0, num2 = 0, ans = 0;
        let attemptCount = 0;
        let qId = "";

        do {
          attemptCount++;
          if (level === 'EASY') {
            num1 = Math.floor(Math.random() * 9) + 1;
            num2 = Math.floor(Math.random() * 9) + 1;
          } else if (level === 'MEDIUM') {
            num1 = Math.floor(Math.random() * 89) + 10;
            num2 = Math.floor(Math.random() * 89) + 10;
          } else {
            num1 = Math.floor(Math.random() * 899) + 100;
            num2 = Math.floor(Math.random() * 899) + 100;
          }

          if (op === 'SUBTRACTION') {
            if (num1 < num2) {
              const temp = num1;
              num1 = num2;
              num2 = temp;
            }
            ans = num1 - num2;
          } else {
            ans = num1 + num2;
          }

          qId = `${op}_${num1}_${num2}`;
        } while (this.askedQuestionIds.has(qId) && attemptCount < 100);

        this.askedQuestionIds.add(qId);
        return { num1, num2, operation: op, answer: ans, id: qId };
      }

      loadNextQuestion() {
        this.currentQuestion = this.generateUniqueQuestion(this.currentLevel, this.currentMode);
        this.currentInput = '';
        this.isProcessingAnswer = false;
        this.renderQuestionScreen();
      }

              <button onclick="window.app.pressKey('CLEAR')" class="py-3 rounded-2xl bg-red-500/20 hover:bg-red-500/30 active:scale-90 text-sm font-bold text-red-300 border border-red-500/30">

      pressKey(key) {
        if (this.isProcessingAnswer) return;

        if (key === 'CLEAR') {
          this.currentInput = '';
        } else if (key === 'BACKSPACE') {
          this.currentInput = this.currentInput.slice(0, -1);
        } else {
          if (this.currentInput.length < 5) {
            this.currentInput += key;
          }
        }

        this.updateAnswerDisplay();

        const targetLen = this.currentQuestion.answer.toString().length;
        if (this.currentInput.length === targetLen) {
          this.verifyAnswer();
        }
      }

      updateAnswerDisplay() {
        const box = document.getElementById('answer-box');
        if (box) {
          box.innerHTML = this.currentInput || '<span class="text-gray-600 animate-pulse">?</span>';
        }
      }

      async verifyAnswer() {
        this.isProcessingAnswer = true;
        const userVal = parseInt(this.currentInput, 10);
        const correctVal = this.currentQuestion.answer;
        const box = document.getElementById('answer-box');
        const feedback = document.getElementById('feedback-banner');

        if (userVal === correctVal) {
          box.className = "w-48 mx-auto h-16 rounded-2xl bg-green-500/30 border-4 border-green-400 flex items-center justify-center text-3xl font-black text-green-300 animate-bounce";
          feedback.innerHTML = `<span class="text-green-400">✓ CORRECT! GREAT JOB!</span>`;
          
          audioSystem.playCorrect();
          this.score.correct++;
          this.score.streak++;

          await this.updateChildProgressDB(true);

          if (this.score.correct % 10 === 0) {
            setTimeout(() => {
              this.triggerMilestoneCelebration(this.score.correct);
            }, 600);
          } else {
            setTimeout(() => {
              this.loadNextQuestion();
            }, 800);
          }

        } else {
          box.className = "w-48 mx-auto h-16 rounded-2xl bg-red-500/30 border-4 border-red-500 flex items-center justify-center text-3xl font-black text-red-300 animate-shake";
          feedback.innerHTML = `<span class="text-red-400">✕ TRY AGAIN! 💪</span>`;
          
          audioSystem.playWrong();
          this.score.wrong++;
          this.score.streak = 0;

          await this.updateChildProgressDB(false);

          setTimeout(() => {
            this.currentInput = '';
            box.className = "w-48 mx-auto h-16 rounded-2xl bg-black/60 border-4 border-pink-400 flex items-center justify-center text-3xl font-black text-white";
            this.updateAnswerDisplay();
            this.isProcessingAnswer = false;
          }, 1200);
        }
      }

      async updateChildProgressDB(isCorrect) {
        if (!this.currentUser || !this.activeChild) return;
        
        const cRef = ref(db, `parents/${this.currentUser.uid}/children/${this.activeChild.childId}`);
        const newCorrect = (this.activeChild.totalCorrect || 0) + (isCorrect ? 1 : 0);
        const newWrong = (this.activeChild.totalWrong || 0) + (isCorrect ? 0 : 1);
        const newTotal = (this.activeChild.totalQuestions || 0) + 1;

        this.activeChild.totalCorrect = newCorrect;
        this.activeChild.totalWrong = newWrong;
        this.activeChild.totalQuestions = newTotal;

        await update(cRef, {
          totalCorrect: newCorrect,
          totalWrong: newWrong,
          totalQuestions: newTotal,
          lastActive: new Date().toISOString()
        });
      }

      triggerMilestoneCelebration(count) {

        else if (count >= 40) title = "YOU ARE SUPERB! 👑";
        else if (count >= 30) title = "EXCELLENT! 💖";
        else if (count >= 20) title = "AWESOME! 🌟";

        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-subtitle').innerText = `You completed ${count} correct answers!`;
        document.getElementById('milestone-modal').classList.remove('hidden');

        audioSystem.playMilestoneSound();

        if (window.confetti) {

            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      }

                <span class="text-xl font-bold text-pink-300">${accuracy}%</span>
              </div>
            </div>

            <h3 class="text-sm font-bold text-white mb-2">🏅 UNLOCKED ACHIEVEMENTS</h3>
            <div class="grid grid-cols-3 gap-2 mb-6">
              <div class="p-3 rounded-xl bg-purple-900/40 border border-pink-500/30 text-center">
                <span class="text-2xl block">🏅</span>
                <span class="text-[10px] font-bold text-purple-200">Math Starter (10+)</span>
              </div>
              <div class="p-3 rounded-xl bg-purple-900/40 border ${child.totalCorrect >= 50 ? 'border-amber-400' : 'border-gray-700 opacity-40'} text-center">
                <span class="text-2xl block">🏆</span>
                <span class="text-[10px] font-bold text-purple-200">Genius Kid (50+)</span>
              </div>
              <div class="p-3 rounded-xl bg-purple-900/40 border ${child.totalCorrect >= 100 ? 'border-amber-400' : 'border-gray-700 opacity-40'} text-center">
                <span class="text-2xl block">👑</span>
                <span class="text-[10px] font-bold text-purple-200">Math Star (100+)</span>
              </div>
            </div>

            <button onclick="window.app.showParentDashboard()" class="w-full py-3 bg-pink-600 rounded-xl font-bold text-sm">
              BACK TO DASHBOARD 🌸
            </button>
          </div>
        `;
        this.render(html);
      }

      showParentSettings() {
        const html = `
          <div class="max-w-md w-full bg-brandDarkPurple border border-purple-500/40 p-6 rounded-3xl shadow-2xl">
            <h3 class="text-2xl font-black text-pink-300 text-center mb-4">PARENT SETTINGS ⚙️</h3>

            <div class="space-y-4">
              <div class="bg-white/5 p-4 rounded-2xl border border-white/10">
                <label class="block text-xs font-bold text-purple-300 mb-2">CHANGE PARENT QUICK ACCESS PIN</label>
                <div class="flex gap-2">
                  <input type="password" id="new-pin-input" maxlength="4" placeholder="New 4-digit PIN" class="px-3 py-2 bg-black/50 border border-purple-400 rounded-xl text-xs w-full">
                  <button onclick="window.app.changePin()" class="px-4 py-2 bg-pink-500 rounded-xl text-xs font-bold whitespace-nowrap">UPDATE PIN</button>
                </div>
              </div>

              <button onclick="window.app.logoutParent()" class="w-full py-3 bg-red-600/80 hover:bg-red-600 rounded-xl font-bold text-sm transition">
                LOG OUT ACCIDENTALLY / EXIT SESSION 🚪
              </button>

              <button onclick="window.app.showParentDashboard()" class="w-full py-3 bg-white/10 rounded-xl font-bold text-xs">
                CLOSE SETTINGS
              </button>
            </div>
          </div>
        `;
        this.render(html);
      }

      async changePin() {
        const val = document.getElementById('new-pin-input').value.trim();
        if (val.length === 4 && !isNaN(val)) {
          await update(ref(db, `parents/${this.currentUser.uid}/profile`), { pin: val });
          alert("Parent Quick Access PIN berjaya dikemas kini!");
          this.showParentDashboard();
        } else {
          alert("Sila masukkan 4 digit nombor sah.");
        }
      }

      async logoutParent() {
        if (this.currentUser) {
          localStorage.removeItem(`auth_device_${this.currentUser.uid}`);
          await signOut(auth);
        }
        this.activeChild = null;
        this.showWelcomeScreen();
      }
    }

    // Initialize globally
    window.app = new AmandaMathApp();
    window.app.init();
  </script>
</body>
</html>
